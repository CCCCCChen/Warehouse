limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=init:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=llm:10m rate=1r/s;

# ============ HTTP: warehouse ============
server {
  listen 80;
  server_name warehouse.hchch.tech;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # HTTP 重定向到 HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# ============ HTTP: api ============
server {
  listen 80;
  server_name api.warehouse.hchch.tech;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # HTTP 重定向到 HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# ============ HTTPS: warehouse (frontend) ============
server {
  listen 443 ssl;
  http2 on;
  server_name warehouse.hchch.tech;

  ssl_certificate     /etc/letsencrypt/live/warehouse.hchch.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/warehouse.hchch.tech/privkey.pem;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 20m;

  location ~ ^/api/init/ {
    limit_req zone=init burst=10 nodelay;
    proxy_pass http://backend:18808;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location = /api/llm/test {
    limit_req zone=llm burst=5 nodelay;
    proxy_request_buffering off;
    proxy_pass http://backend:18808;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;
  }

  location /api/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://backend:18808;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /uploads/ {
    client_max_body_size 20m;
    proxy_pass http://backend:18808;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
}

