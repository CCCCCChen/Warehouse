services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      - ARK_API_KEY=${ARK_API_KEY}
      - ARK_BASE_URL=${ARK_BASE_URL}
      - ARK_MODEL=${ARK_MODEL}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS}
    volumes:
      - ./data:/app/data
    expose:
      - "18808"
    networks:
      - bb-internal-network

  web:
    container_name: warehouse-nginx
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - VUE_APP_API_BASE_URL=${VUE_APP_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - gateway-network
      - bb-internal-network

networks:
  gateway-network:
    external: true
  bb-internal-network:
    driver: bridge
